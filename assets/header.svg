<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 268" width="840" height="268" role="img" aria-labelledby="title desc">
  <title id="title">Gabriel Tetzner Menegueti</title>
  <desc id="desc">Terminal window introducing Gabriel Tetzner Menegueti: Java and Spring Boot backends, optimization, Linux, networks and security, from Espirito Santo, Brazil.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace; font-size: 19px; }
    .prompt { fill: #3fb950; font-weight: 700; }
    .cmd { fill: #e6edf3; }
    .name { fill: #79c0ff; font-size: 30px; font-weight: 700; }
    .out { fill: #c9d1d9; }
    .muted { fill: #8b949e; font-size: 14px; }
    .line { animation: reveal .35s ease-out both; }
    .l2 { animation-delay: .35s; }
    .l3 { animation-delay: .9s; }
    .l4 { animation-delay: 1.25s; }
    .l5 { animation-delay: 1.8s; }
    .l6 { animation-delay: 2.15s; }
    .cursor { fill: #3fb950; animation: reveal .35s ease-out 2.7s both, blink 1.1s steps(2, start) 3.05s infinite; }
    @keyframes reveal { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .line, .cursor { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="838" height="266" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 38V13a12 12 0 0 1 12-12h814a12 12 0 0 1 12 12v25z" fill="#161b22"/>
  <line x1="1" y1="38" x2="839" y2="38" stroke="#30363d"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="420" y="25" text-anchor="middle" class="muted">tetzdesen@github: ~</text>

  <g class="line l1"><text x="28" y="72"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">whoami</tspan></text></g>
  <g class="line l2"><text x="28" y="110" class="name">Gabriel Tetzner Menegueti</text></g>
  <g class="line l3"><text x="28" y="150"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">cat focus.txt</tspan></text></g>
  <g class="line l4"><text x="28" y="178" class="out">Java &amp; Spring Boot · optimization · Linux, networks &amp; security</text></g>
  <g class="line l5"><text x="28" y="216"><tspan class="prompt">$</tspan><tspan class="cmd" dx="10">echo $LOCATION</tspan></text></g>
  <g class="line l6"><text x="28" y="244" class="out">Espírito Santo, Brazil</text></g>
  <rect class="cursor" x="284" y="229" width="11" height="20"/>
</svg>
